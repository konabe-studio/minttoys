name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The base of Linux Mint 22, rather than whatever ubuntu-latest points at.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Linux Mint 22 ships Python 3.12, LMDE 7 ships 3.13.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check
      - name: Format
        run: ruff format --check
      - name: Test
        run: pytest

  session:
    # The system Python with PyGObject, GTK 3, XApp and pytest from apt, as a Linux Mint 22
    # user has them, a session bus of its own and a virtual display, so the tests that start
    # the daemon or open the panel icon run here too. There is no session manager on that
    # bus, so the inhibit tests skip; they need a desktop session.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: |
          sudo apt-get update
          packages="python3-gi python3-pytest python3-xapp dbus gir1.2-gtk-3.0 gir1.2-xapp-1.0 xvfb xauth"
          sudo apt-get install --yes --no-install-recommends $packages
      - name: Test
        run: xvfb-run --auto-servernum dbus-run-session -- python3 -m pytest

  package:
    # Builds the .deb, checks it with lintian, installs it, tries it, and purges it again,
    # looking for anything it left behind. The .deb is kept, to install by hand on LMDE.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the build tools
        run: |
          sudo apt-get update
          packages="build-essential dbus debhelper dh-python lintian python3-pytest tzdata"
          sudo apt-get install --yes --no-install-recommends $packages
      - name: Build
        run: |
          dpkg-buildpackage --build=binary --no-sign
          mkdir dist
          mv ../minttoys_* dist/
      - name: Lintian
        # The .deb itself: the .changes of a development build is UNRELEASED by design.
        run: lintian --fail-on error --display-info dist/*.deb
      - name: Install, use and purge
        run: |
          sudo apt-get install --yes ./dist/minttoys_*_all.deb
          dpkg -L minttoys > installed.txt
          minttoys --help > /dev/null
          # D-Bus starts the daemon on the first call, from the installed service file.
          test "$(dbus-run-session -- minttoys awake status)" = "Awake is off."
          sudo apt-get purge --yes minttoys
          left=$(grep -E 'minttoys|konabe_studio' installed.txt | while read -r path; do
            if [ -e "$path" ]; then echo "$path"; fi
          done)
          if [ -n "$left" ]; then echo "left behind after purge:"; echo "$left"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: minttoys-deb
          path: dist/minttoys_*_all.deb
