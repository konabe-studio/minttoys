name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The base of Linux Mint 22, rather than whatever ubuntu-latest points at.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Linux Mint 22 ships Python 3.12, LMDE 7 ships 3.13.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check
      - name: Format
        run: ruff format --check
      - name: Test
        run: pytest
